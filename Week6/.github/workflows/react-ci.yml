name: Week 6 React CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Build all 19 React applications
        run: npm run build
      - name: Run HOL 18 and HOL 19 tests
        run: npm test

name: Week 7 Java DevOps CI

on:
  push:
    paths:
      - "WEEK 7/**"
      - ".github/workflows/week7-ci.yml"
  pull_request:
    paths:
      - "WEEK 7/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "WEEK 7"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make scripts executable
        run: chmod +x verify-week7.sh 02-Docker-Containerization/task-service/*.sh 05-GenAI-Fundamentals/genai-lab/*.sh

      - name: Compile and test Week 7 labs
        run: ./verify-week7.sh

      - name: Build Docker image
        run: docker build -t week7-task-service:ci ./02-Docker-Containerization/task-service

      - name: Check for common secret files
        run: |
          ! find . -type f \( -name "*.pem" -o -name "*.p12" -o -name ".env" \) | grep .
